# Exemple de fichier de valeurs personnalisées pour Helm (chart nginx Bitnami)
# Utilisation : helm install mon-nginx bitnami/nginx -f values-custom.yaml

replicaCount: 2

service:
  type: NodePort
  nodePorts:
    http: "30080"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
