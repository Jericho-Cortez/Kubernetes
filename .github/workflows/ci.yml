name: CI
on:
  push:
    branches: ["main","master"]
  pull_request:
    branches: ["main","master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Run yamllint on manifests
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 150}}}" manifests/ || true
      - name: Check broken image links in docs
        run: |
          echo "Checking for broken image references in docs/..."
          grep -rn '!\[' docs/ || echo "No image references found"
